# .webmanifest va .ico uchun MIME type
types {
    application/manifest+json  webmanifest;
    image/x-icon               ico;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;

    ssl_certificate     /etc/letsencrypt/live/optimhalolmarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimhalolmarket.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/optimhalolmarket_access.log;
    error_log  /var/log/nginx/optimhalolmarket_error.log;

    # Media fayllar
    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Manifest — Firefox va Chrome uchun to'g'ri Content-Type
    location = /static/site.webmanifest {
        alias /app/staticfiles/site.webmanifest;
        access_log off;
        default_type application/manifest+json;
        add_header Content-Type  "application/manifest+json; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # favicon.ico
    location = /static/favicon.ico {
        alias /app/staticfiles/favicon.ico;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Barcha static fayllar
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Django
    location / {
        proxy_pass http://app:8005;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# HTTP → HTTPS
server {
    listen 80;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}
