# HTTPS server
server {
    listen 443 ssl http2;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;
    
    # SSL konfiguratsiyalar
    ssl_certificate /etc/letsencrypt/live/optimhalolmarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimhalolmarket.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    client_max_body_size 50M;
    
    # Media fayllar (host papkasidan)
    location /media/ {
        alias /app/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }
    
    # Static fayllar (Docker volume dan)
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        
        # Static fayl yo'q bo'lsa 404 qaytarish
        try_files $uri $uri/ =404;
    }
    
    # Django ilovasi
    location / {
        proxy_pass http://app:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeout sozlamalari
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Xavfsizlik sarlavhalari
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Loglar
    access_log /var/log/nginx/optimhalolmarket_access.log;
    error_log /var/log/nginx/optimhalolmarket_error.log;
}

# HTTP dan HTTPS ga yo'naltirish
server {
    listen 80;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;
    
    # Let's Encrypt uchun
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Boshqa hamma so'rovlarni HTTPS ga yo'naltirish
    location / {
        return 301 https://$server_name$request_uri;
    }
}