# ============================================================
#  optimhalolmarket.uz  —  Host Nginx konfiguratsiyasi
#  Joyi: /etc/nginx/sites-available/optimhalolmarket.uz
# ============================================================

# HTTP → HTTPS yo'naltirish
server {
    listen 80;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name optimhalolmarket.uz www.optimhalolmarket.uz;

    ssl_certificate     /etc/letsencrypt/live/optimhalolmarket.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/optimhalolmarket.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/optimhalolmarket_access.log;
    error_log  /var/log/nginx/optimhalolmarket_error.log;

    # Media fayllar
    location /media/ {
        alias /root/internet_dokon/media/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Webmanifest — to'g'ri Content-Type
    location = /static/site.webmanifest {
        alias /root/internet_dokon/staticfiles/site.webmanifest;
        access_log off;
        default_type application/manifest+json;
        add_header Content-Type  "application/manifest+json; charset=utf-8";
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    # Favicon
    location = /favicon.ico {
        alias /root/internet_dokon/staticfiles/favicon.ico;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /static/favicon.ico {
        alias /root/internet_dokon/staticfiles/favicon.ico;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Static fayllar
    location /static/ {
        alias /root/internet_dokon/staticfiles/;
        access_log off;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "*";
    }

    # Django ilovasi (Docker ichidagi gunicorn, host port 8000)
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Port  $server_port;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
